# 冒烟测试：几十条数据跑通全流程，不做正式结论
base_model: models/tinyllama-1.1b-chat
train_file: data/processed/train.json
val_file: data/processed/val.json
output_dir: outputs/tinyllama-smoke

num_train_epochs: 1
learning_rate: 0.0002
lr_scheduler_type: cosine
warmup_ratio: 0.03
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
max_seq_len: 512
logging_steps: 1
eval_steps: 9999
save_steps: 9999
save_total_limit: 1
gradient_checkpointing: false

load_in_4bit: false
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

seed: 42
